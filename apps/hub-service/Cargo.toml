[package]
name = "hub-service"
version = "2.5.2"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
dirs = "5"
once_cell = "1"
futures = "0.3"
# Office 文档解析
calamine = "0.26"  # Excel (xlsx/xls) 解析
docx-rs = "0.4"    # Word (docx) 解析
zip = "0.6"        # 用于解压 Office 文档（docx/pptx/xlsx/epub 都是 zip 格式）
quick-xml = "0.31" # 用于解析 XML（Office 文档内部格式）
# HTML 解析
scraper = "0.20"   # HTML 解析和文本提取
# PDF 解析
pdf-extract = "0.7" # PDF 文本提取
# 文件系统监控
notify = "7"
