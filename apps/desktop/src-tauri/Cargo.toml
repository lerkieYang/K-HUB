[package]
name = "knowledgehub-desktop"
version = "1.1.2"
description = "K-HUB Desktop Application"
authors = ["K-HUB Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-sidecar", "shell-open", "system-tray", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "0.6"
walkdir = "2.3"
winreg = "0.52"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
